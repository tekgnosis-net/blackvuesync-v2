# see https://tekgnosis-net.github.io/blackvuesync-v2/guide/installation/. environment variables below are read only on
# the first start, to create /config/settings.json; afterwards settings are
# changed in the web ui (Settings page). PUID, PGID, TZ and
# BLACKVUESYNC_TRUST_PROXY are read on every start.
services:
  blackvuesync-v2:
    # :3 receives every 3.x release; :latest follows the main branch.
    image: ghcr.io/tekgnosis-net/blackvuesync-v2:3
    container_name: blackvuesync-v2
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # recording download destination; changes only the part before the colon.
      - /mnt/dashcam:/recordings:rw
      # settings.json, stats.db and logs/ live here; keeps them across upgrades.
      - ./config:/config:rw
    environment:
      # dashcam ip address or hostname.
      ADDRESS: dashcam.example.net

      # user and group ids that own the recordings and config directories.
      PUID: 1000
      PGID: 1000

      # container clock timezone; matches the dashcam. blackvue dashcams do not
      # follow daylight saving time, so their clock needs periodic adjustment.
      TZ: America/New_York

      # timezone the sync schedule runs in (defaults to UTC, not TZ).
      BLACKVUESYNC_TIMEZONE: America/New_York

      # cron schedule for syncs.
      BLACKVUESYNC_SCHEDULE: '*/15 * * * *'

      # skips the first-run page when set (12+ characters). removes it after
      # the first start.
      # BLACKVUESYNC_ADMIN_PASSWORD: change-me-please

      # set to 1 behind an https reverse proxy.
      # BLACKVUESYNC_TRUST_PROXY: '1'

      # "date" oldest first, "rdate" newest first, "type" manual, events,
      # normal, then parking.
      PRIORITY: date

      # "daily", "weekly", "monthly", "yearly" or "none".
      GROUPING: none

      # deletes recordings older than this ("d" days, "w" weeks).
      KEEP: 2w

      # stops downloading above this used-disk percentage.
      MAX_USED_DISK: 90

      # dashcam connection timeout in seconds.
      TIMEOUT: 10.0

      # 0 normal, 1 verbose, 2 debug.
      VERBOSE: 0

      # "text" or "json".
      LOG_FORMAT: text

      # optional prometheus metrics.
      # METRICS_FILE: /config/blackvuesync.prom
      # METRICS_PUSHGATEWAY_URL: http://pushgateway:9091
