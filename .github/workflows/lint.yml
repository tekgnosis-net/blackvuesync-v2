name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # pre-commit builds the trufflehog hook with go; "|direct" falls back to a
  # direct download on any module-proxy error, not only 404/410.
  GOPROXY: https://proxy.golang.org|direct
  PIP_DEFAULT_TIMEOUT: '60'
  PIP_RETRIES: '10'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
